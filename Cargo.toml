[workspace]
resolver = "2"
members = [
"contracts/vault-contract",
"contracts/rewards",
"network-node"
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/Axionvera/axionvera-network"

[workspace.dependencies]
soroban-sdk = "22.0.0"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
